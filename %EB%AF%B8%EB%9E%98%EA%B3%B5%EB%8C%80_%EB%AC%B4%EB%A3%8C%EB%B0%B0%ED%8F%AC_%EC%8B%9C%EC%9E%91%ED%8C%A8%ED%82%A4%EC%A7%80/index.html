<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>미래공대 | 공대원 관리 데모</title><style>:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#17243b;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.shell{display:flex;min-height:100vh}.sidebar{width:252px;background:#11233e;color:white;padding:24px 16px;position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:21px;padding:4px 12px 22px}.brand small{display:block;color:#a6c3ed;font-weight:500;font-size:12px;margin-top:6px}.nav{display:block;width:100%;background:transparent;color:#cbd8e9;border:0;text-align:left;padding:12px 14px;border-radius:10px;margin:3px 0}.nav.active,.nav:hover{background:#28486d;color:#fff}.main{flex:1;min-width:0;padding:28px;max-width:1450px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.top h1{font-size:25px;margin:0}.muted{color:#64748b;font-size:13px}.pill{border-radius:100px;background:#e7effb;padding:6px 10px;font-size:12px;color:#1d4d83;display:inline-block}.pill.ok{background:#dcfce7;color:#166534}.pill.warn{background:#fef3c7;color:#92400e}.pill.bad{background:#fee2e2;color:#991b1b}.card{background:#fff;border:1px solid #e2e9f3;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 3px 12px #233c6010}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{font-size:27px;font-weight:800;margin:8px 0}.flex{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}.btn{border:0;border-radius:9px;padding:9px 14px;background:#2563eb;color:#fff;font-weight:600}.btn.secondary{background:#e8eef7;color:#244466}.btn.danger{background:#dc3545}.btn.small{padding:5px 9px;font-size:12px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.field label{font-size:12px;color:#51627b;font-weight:700}.field input,.field select,.field textarea,select,input[type=time],input[type=date]{width:100%;border:1px solid #cdd8e7;background:#fff;border-radius:8px;padding:9px;min-width:0}.field textarea{min-height:70px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;border-bottom:1px solid #edf1f7;padding:11px 9px;font-size:13px}th{background:#f8faff;color:#526783;font-weight:700}tr:hover td{background:#fbfdff}.sectiontitle{margin:0 0 15px;font-size:18px}.notice{border:1px solid #f7dba0;background:#fffbeb;padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:1px solid #d4dfed;border-radius:9px;background:#fff;padding:9px 13px}.tabs button.sel{background:#2563eb;color:#fff;border-color:#2563eb}.empty{text-align:center;color:#8290a5;padding:30px}.preview{max-width:170px;max-height:110px;border-radius:8px;object-fit:contain;border:1px solid #dce3ed}.tiny{font-size:12px}.footer{margin:22px 0;color:#7d8ca2;font-size:12px}.switch{display:flex;gap:7px}.switch a{color:#fff;text-decoration:none;background:#294a72;padding:8px 10px;border-radius:8px;font-size:12px}.progress{height:9px;background:#e6edf6;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#3b82f6}.photo{display:flex;align-items:center;gap:12px;flex-wrap:wrap}hr{border:0;border-top:1px solid #e9eef5;margin:18px 0}@media(max-width:900px){.sidebar{width:190px}.main{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.shell{display:block}.sidebar{width:100%;height:auto;position:static;padding:12px}.brand{padding:4px 8px;font-size:18px}.navs{display:flex;overflow:auto}.nav{white-space:nowrap;width:auto}.main{padding:14px}.grid,.grid.two{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}

</style></head><body><div style="position:sticky;top:0;z-index:9999;background:#fff3cd;color:#563b00;border-bottom:1px solid #e9cf7c;padding:10px 16px;font:600 13px system-ui;text-align:center">⚠️ 화면 확인용 데모입니다. 실제 회원가입·비밀번호·전화번호를 입력하지 마세요. 데이터는 사용자별 브라우저에만 저장되며 공대원 간 공유되지 않습니다.</div><div id="app"></div><script>window.START_ADMIN=false;</script><script>(()=>{'use strict';
const K='mirae_member_only_demo_v3_fixed', raids=[{id:'ht',name:'미래공대 혼테일',short:'혼테일',days:[0,1,2,3],time:'23:00',cap:1},{id:'c1',name:'미래공대 카쿰 1공대',short:'카쿰 1공대',days:[5],time:'21:00',cap:3},{id:'c2',name:'미래공대 카쿰 2공대',short:'카쿰 2공대',days:[6],time:'21:00',cap:3}];
const initial={users:[{id:'u1',nick:'윤미래',level:165,job:'나이트로드',power:'12500',contact:'',password:'',status:'approved',raids:['ht','c1'],image:'',verified:false},{id:'u2',nick:'빛나연',level:160,job:'비숍',power:'9800',contact:'',password:'',status:'approved',raids:['ht','c2'],image:'',verified:false},{id:'u3',nick:'리하이오',level:155,job:'다크나이트',power:'8700',contact:'',password:'',status:'pending',raids:[],image:'',verified:false}],checkins:{},guests:[],loot:[],completed:[],logs:[]};
let db;try{db=JSON.parse(localStorage.getItem(K))||structuredClone(initial)}catch{db=structuredClone(initial)};db.completed ||= [];let admin=!!window.START_ADMIN,actor='',page=admin?'dashboard':'schedule',raid='ht',date='',monthOffset=0;let session=null,authTab='login';try{session=JSON.parse(sessionStorage.getItem('mirae_demo_session_v3')||'null')}catch{};if(!session){session=admin?{role:'admin'}:{role:'member',id:'u1'};sessionStorage.setItem('mirae_demo_session_v3',JSON.stringify(session))}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('브라우저 저장 공간이 부족합니다. 사진 크기를 줄여주세요.')}},rid=id=>raids.find(x=>x.id===id),me=()=>db.users.find(x=>x.id===actor),log=(what)=>{db.logs.unshift({what,by:admin?'공대장':me()?.nick||'공대원',at:new Date().toLocaleString('ko-KR')});db.logs=db.logs.slice(0,150)},fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,day=s=>new Date(s+'T12:00:00'), nextDate=id=>{let d=new Date();for(let i=0;i<8;i++){if(raids.find(r=>r.id===id).days.includes(d.getDay()))return fmt(d);d.setDate(d.getDate()+1)}return fmt(d)},allowed=u=>admin||(u?.status==='approved'&&u?.raids.includes(raid)),visibleRaids=()=>admin?raids:raids.filter(r=>me()?.status==='approved'&&me()?.raids.includes(r.id)),syncRaid=()=>{if(!visibleRaids().some(r=>r.id===raid)){raid=visibleRaids()[0]?.id||'';date=raid?nextDate(raid):''}},key=(r,d,u)=>`${r}|${d}|${u}`,check=(r,d,u)=>db.checkins[key(r,d,u)]||{participation:'unset',time:'',alt:'waiting',altNick:'',subNick:''};
function dates(r,n=40){let a=[],d=new Date();d.setDate(d.getDate()-2);for(let i=0;i<110&&a.length<n;i++){if(r.days.includes(d.getDay()))a.push(fmt(d));d.setDate(d.getDate()+1)}return a}
function field(label,id,type='text',value='',extra=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`}function select(label,id,options,value){return `<div class="field"><label>${label}</label><select id="${id}">${options.map(o=>`<option value="${esc(o[0])}" ${o[0]===value?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`}function pill(t,c=''){return `<span class="pill ${c}">${esc(t)}</span>`}function tabs(){return `<div class="tabs">${visibleRaids().map(r=>`<button class="${raid===r.id?'sel':''}" onclick="UI.raid('${r.id}')">${r.short}</button>`).join('')}</div>`}function chooser(){return `<div class="flex">${tabs()}<div class="field" style="min-width:180px"><label>진행 날짜</label><select id="selectedDate" onchange="UI.date(this.value)">${dates(rid(raid),55).map(d=>`<option ${d===date?'selected':''}>${d}</option>`).join('')}</select></div></div>`}
function shell(){let links=admin?[['dashboard','🏠 공대 운영 현황'],['approvals','🔔 가입 승인'],['permissions','🛡 공대별 권한 관리'],['members','👥 공대원 명단'],['phones','📱 회원 휴대폰 관리'],['schedule','📅 날짜별 참여'],['guests','🎫 손님 구인 관리'],['verification','📷 레벨·스공 인증'],['loot','🎁 아이템 획득 기록'],['completed','✅ 트라이 완료 기록'],['history','🕘 변경 기록']]:[['dashboard','🏠 내 현황'],['schedule','📅 참여 체크'],['members','👥 공대원 명단'],['guests','🎫 손님 구인 현황'],['verification','📷 내 인증'],['loot','🎁 아이템 획득 기록'],['completed','✅ 트라이 완료 기록']];return `<div class="shell"><aside class="sidebar"><div class="brand">미래공대 <small>${admin?'공대장 ADMIN':'공대원 MEMBER'} · 공대원 관리 데모</small></div>${admin?`<button class="pending-banner" onclick="UI.page('approvals')">🔔 가입 승인 대기 <strong>${db.users.filter(u=>u.status==='pending').length}명</strong></button>`:''}<div class="navs">${links.map(([p,t])=>`<button class="nav ${p===page?'active':''}" onclick="UI.page('${p}')">${t}</button>`).join('')}</div><hr><div class="switch"><button class="nav" onclick="UI.logout()">🚪 로그아웃</button></div></aside><main class="main"><div class="top"><h1>${links.find(x=>x[0]===page)?.[1]||'미래공대'}</h1><div>${admin?pill('공대장 미리보기','ok'):pill(me()?.nick||'공대원','ok')}</div></div><div class="notice">⚠ <b>공대원 관리 전용 데모 · 분배시트는 별도 운영</b> — 실제 로그인·보안·서버 동기화가 적용되지 않았습니다. 예시 계정과 데이터로 작동하며, 변경 내용은 현재 브라우저에만 저장됩니다. 실제 개인정보나 비밀번호를 입력하지 마세요.</div><div id="content"></div><div class="footer">미래공대 공대원 관리 데모 · 배포 전 설계 확인용 · 브라우저 저장 데이터는 서버에 공유되지 않습니다.</div></main></div>`}
function dashboard(){let next=visibleRaids().map(r=>({r,d:dates(r,10)[0]}));return `${admin?`<div class="card approval-highlight"><div class="flex between"><div><h3 style="margin:0 0 6px">🔔 신규 가입 승인 대기</h3><p class="muted">승인을 기다리는 공대원 ${db.users.filter(u=>u.status==='pending').length}명 · 공대별 소속을 지정해 주세요.</p></div><button class="btn" onclick="UI.page('approvals')">가입 신청 확인</button></div>${db.users.filter(u=>u.status==='pending').map(u=>`<div style="padding:6px 0">• ${esc(u.nick)}</div>`).join('')||'<span class="muted">현재 대기 중인 신청이 없습니다.</span>'}</div>`:''}<div class="grid">${[['등록 공대원',db.users.filter(x=>x.status==='approved').length+'명'],['가입 승인 대기',db.users.filter(x=>x.status==='pending').length+'명'],['등록 손님',db.guests.filter(g=>g.status!=='cancelled').length+'명'],['인증 대기',db.users.filter(u=>u.image&&!u.verified).length+'명']].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('')}</div><div class="card"><h3 class="sectiontitle">공대 고정 일정</h3><div class="grid">${visibleRaids().map(r=>`<div><b>${r.name}</b><p class="muted">${r.id==='ht'?'일·월·화·수요일':'매주 '+(r.id==='c1'?'금요일':'토요일')} ${r.time}</p>${pill('손님 정원 '+r.cap+'명')}</div>`).join('')}</div></div><div class="card"><h3 class="sectiontitle">가까운 일정</h3>${next.map(({r,d})=>`<div class="flex between" style="padding:10px;border-bottom:1px solid #eee"><span>${d} · ${r.name}</span><button class="btn small secondary" onclick="UI.jump('${r.id}','${d}')">참여 현황 보기</button></div>`).join('')}</div>`}
function members(){let users=db.users.filter(u=>admin||u.status==='approved'&&u.raids.some(x=>me()?.raids.includes(x)));if(!admin&&!visibleRaids().length)return '<div class="card">승인된 소속 공대가 없습니다.</div>'; return `<div class="card"><h3 class="sectiontitle">공대원 명단 · ${users.length}명</h3><div class="tablewrap"><table><thead><tr><th>닉네임</th><th>레벨</th><th>직업</th><th>스공</th><th>소속 공대</th><th>인증</th>${admin?'<th>수정</th>':''}</tr></thead><tbody>${users.map(u=>`<tr><td><b>${esc(u.nick)}</b></td><td>${esc(u.level)}</td><td>${esc(u.job)}</td><td>${esc(u.power)}</td><td>${u.raids.filter(r=>admin||me()?.raids.includes(r)).map(r=>rid(r).short).join(', ')||'-'}</td><td>${pill(u.verified?'완료':u.image?'대기':'미인증',u.verified?'ok':'warn')}</td>${admin?`<td><button class="btn small secondary" onclick="UI.editMember('${u.id}')">수정</button></td>`:''}</tr>`).join('')}</tbody></table></div></div>${admin?`<div class="card"><h3 class="sectiontitle">공대원 정보 수정</h3><div id="memberEditor" class="muted">위 명단에서 수정을 선택하세요.</div></div>`:''}`}
function approvalRow(u, pending){return `<div class="approval-row"><div class="flex between"><b>${esc(u.nick)}</b>${pill(pending?'승인 대기':u.status==='approved'?'승인':'정지',pending?'warn':u.status==='approved'?'ok':'bad')}</div><p class="muted">${pending?'가입 신청자에게 허용할 공대를 선택한 뒤 승인하세요.':'기존 공대 권한을 변경하거나 계정을 정지할 수 있습니다.'}</p><div class="flex" style="margin:10px 0">${raids.map(r=>`<label class="tiny"><input type="checkbox" class="grant-${u.id}" value="${r.id}" ${u.raids.includes(r.id)?'checked':''}> ${r.short}</label>`).join('')}</div><div class="flex"><button class="btn small" onclick="UI.approve('${u.id}')">${pending?'가입 승인':'권한 저장'}</button><button class="btn small secondary" onclick="UI.reject('${u.id}')">${pending?'가입 거절':'계정 정지'}</button></div></div>`}
function approvals(){let pending=db.users.filter(u=>u.status==='pending');return `<div class="card"><h3 class="sectiontitle">🔔 신규 가입 승인 대기 ${pill(pending.length+'명','warn')}</h3><p class="muted">새로 가입 신청한 공대원만 표시합니다. 공대별 소속 권한을 선택하고 승인하세요.</p>${pending.map(u=>approvalRow(u,true)).join('')||'<div class="empty">현재 승인 대기 중인 공대원이 없습니다.</div>'}</div><div class="card"><h3 class="sectiontitle">승인된 공대원 권한 관리</h3><p class="muted">이미 승인된 회원의 공대 변경은 왼쪽 「공대별 권한 관리」에서 진행합니다.</p><button class="btn secondary" onclick="UI.page('permissions')">공대별 권한 관리로 이동</button></div>`}
function permissions(){let users=db.users.filter(u=>u.status!=='pending');return `<div class="card"><h3 class="sectiontitle">🛡 공대별 권한 관리</h3><p class="muted">승인된 회원의 공대 배정을 변경하고 계정을 정지할 수 있습니다. 신규 가입은 별도 가입 승인 메뉴에서 처리합니다.</p>${users.map(u=>approvalRow(u,false)).join('')||'<div class="empty">등록된 회원이 없습니다.</div>'}</div>`}
function timeOptions(raidId,selected,disabled){const r=rid(raidId),[h,m]=r.time.split(':').map(Number),end=h*60+m;let opts='<option value="">미선택</option>';for(let t=end-20;t<=end;t++){let v=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');opts+=`<option value="${v}" ${selected===v?'selected':''}>${v}${t===end?' (트라이 시작)':''}</option>`}return `<select ${disabled?'disabled':''} class="time-select" id="TIME_ID">${opts}</select>`}
function completedRecord(r,d){return db.completed.find(x=>x.raid===r&&x.date===d)}
function completedPage(){let rows=db.completed.filter(x=>admin||me()?.raids.includes(x.raid)).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="card"><h3 class="sectiontitle">✅ 트라이 완료 기록</h3><p class="muted">공대장이 트라이 완료를 확정한 시점의 참여 명단을 보관합니다. 대타 구인완료는 실제 참여 인원으로 집계하며, 부캐릭 청구 닉네임도 함께 표시합니다.</p>${rows.length?rows.map(x=>`<div class="card" style="margin:12px 0"><div class="flex between"><h3>${esc(rid(x.raid)?.short||x.raid)} · ${esc(x.date)} ${esc(rid(x.raid)?.time||'')}</h3>${pill('완료 · '+x.people.length+'명','ok')}</div><p class="muted">완료 처리: ${esc(x.completedAt)} · 공대장</p><div class="tablewrap"><table><thead><tr><th>기존 공대원</th><th>실제 참여 캐릭터</th><th>참여 구분</th><th>접속시간</th><th>부캐릭 청구 닉네임</th></tr></thead><tbody>${x.people.map(z=>`<tr><td>${esc(z.member)}</td><td><b>${esc(z.actual)}</b></td><td>${esc(z.type)}</td><td>${esc(z.time||'-')}</td><td>${esc(z.subNick||'-')}</td></tr>`).join('')}</tbody></table></div>${admin?`<button class="btn small secondary" onclick="UI.reopenTry('${x.raid}','${x.date}')">완료 취소 · 수정 재개</button>`:''}</div>`).join(''):'<div class="empty">완료된 트라이가 없습니다.</div>'}</div>`}
function schedule(){let r=rid(raid),list=db.users.filter(u=>u.status==='approved'&&u.raids.includes(raid));if(!admin&&!allowed(me()))return `${tabs()}<div class="card">배정받지 않은 공대입니다. 해당 공대 참여 정보는 볼 수 없습니다.</div>`;let finished=completedRecord(raid,date);let records=list.map(u=>({u,c:check(raid,date,u.id)})),participating=records.filter(x=>x.c.participation==='yes'||(x.c.participation==='no'&&x.c.alt==='done')).length,un=records.filter(x=>x.c.participation==='unset').length,wait=records.filter(x=>x.c.participation==='no'&&x.c.alt!=='done').length,done=records.filter(x=>x.c.participation==='no'&&x.c.alt==='done').length;return `${chooser()}${finished?`<div class="card">${pill('트라이 완료','ok')} 이 날짜는 완료 처리되어 수정할 수 없습니다. <button class="btn small secondary" onclick="UI.page('completed')">완료 명단 보기</button></div>`:''}<div class="grid">${[['참여',participating],['미체크',un],['대타 미구인',wait],['대타 구인완료',done]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="metric">${x[1]}명</div></div>`).join('')}</div><div class="card"><h3 class="sectiontitle">${r.short} · ${date} ${r.time}</h3><div class="tablewrap"><table><thead><tr><th>닉네임</th><th>참여 여부</th><th>접속시간</th><th>부캐릭 청구 닉네임</th><th>대타 상태</th><th>대타 닉네임</th><th>저장</th></tr></thead><tbody>${records.map(({u,c})=>{let writable=!finished&&(admin||u.id===actor);return `<tr><td><b>${esc(u.nick)}</b></td><td><select id="p-${u.id}" ${!writable?'disabled':''} onchange="UI.toggleAlt('${u.id}')"><option value="unset" ${c.participation==='unset'?'selected':''}>미체크</option><option value="yes" ${c.participation==='yes'?'selected':''}>참여 O</option><option value="no" ${c.participation==='no'?'selected':''}>미참여 X</option></select></td><td>${timeOptions(raid,c.time,!writable).replace('TIME_ID','t-'+u.id)}</td><td><input id="s-${u.id}" value="${esc(c.subNick)}" placeholder="부캐릭 닉네임" ${!writable?'disabled':''}></td><td><select id="a-${u.id}" ${!writable||c.participation!=='no'?'disabled':''}><option value="waiting" ${c.alt!=='done'?'selected':''}>${c.participation==='yes'?'X (자동)':c.participation==='unset'?'미체크':'미구인'}</option><option value="done" ${c.alt==='done'?'selected':''}>구인완료</option></select></td><td><input id="n-${u.id}" value="${esc(c.altNick)}" placeholder="대타 닉네임" ${!writable?'disabled':''}></td><td>${writable?`<button class="btn small" onclick="UI.saveCheck('${u.id}')">저장</button>`:'조회만'}</td></tr>`}).join('')}</tbody></table></div>${admin&&!finished?`<div style="margin-top:16px"><button class="btn" onclick="UI.completeTry()">✅ 트라이 완료 처리 · 참여 명단 저장</button><p class="muted">참여 O 또는 대타 구인완료된 인원만 완료 명단에 저장합니다.</p></div>`:''}</div>`}
function guests(){if(!admin&&!allowed(me()))return '<div class="card">승인된 소속 공대의 손님 구인만 조회할 수 있습니다.</div>';let r=rid(raid),all=db.guests.filter(g=>g.raid===raid&&g.date===date),active=all.filter(g=>g.status!=='cancelled'),n=active.length;return `${chooser()}<div class="grid"><div class="card"><div class="muted">모집 정원</div><div class="metric">${r.cap}명</div></div><div class="card"><div class="muted">예약 등록</div><div class="metric">${n}명</div></div><div class="card"><div class="muted">남은 자리</div><div class="metric">${Math.max(0,r.cap-n)}명</div></div><div class="card"><div class="muted">모집 상태</div><div class="metric" style="font-size:19px">${n>=r.cap?'구인완료':'구인중'}</div></div></div><div class="card"><h3 class="sectiontitle">${r.short} · 다가오는 트라이 3회 구인 현황</h3><p class="muted">선택한 공대의 가장 가까운 진행 일정 3회만 표시합니다. 다른 공대 일정은 섞이지 않습니다.</p><div class="tablewrap"><table><thead><tr><th>날짜</th><th>공대</th><th>예약</th><th>남은 자리</th><th>상태</th></tr></thead><tbody>${[rid(raid)].filter(Boolean).flatMap(rr=>{let upcoming=[];let today=new Date();today.setHours(0,0,0,0);for(let i=0;upcoming.length<3&&i<30;i++){let dt=new Date(today);dt.setDate(today.getDate()+i);if(rr.days.includes(dt.getDay()))upcoming.push(fmt(dt))}return upcoming.map(d=>{let count=db.guests.filter(g=>g.raid===rr.id&&g.date===d&&g.status!=='cancelled').length;return `<tr><td>${d}</td><td>${rr.short}</td><td>${count}/${rr.cap}</td><td>${rr.cap-count}</td><td>${pill(count>=rr.cap?'구인완료':'구인중',count>=rr.cap?'ok':'warn')}</td></tr>`})}).join('')}</tbody></table></div></div><div class="card"><h3 class="sectiontitle">${r.short} · ${date} 손님 목록</h3><div class="tablewrap"><table><thead><tr><th>손님</th><th>레벨/직업</th><th>담당자</th><th>예약금</th><th>공대장 확인</th><th>잔금</th><th>공대장 확인</th><th>상태</th><th>관리</th></tr></thead><tbody>${all.map(g=>`<tr><td><b>${esc(g.nick)}</b></td><td>${esc(g.level)} / ${esc(g.job)}</td><td>${esc(g.ownerName)}</td><td>${Number(g.deposit||0).toLocaleString()}만</td><td>${admin?`<input type="checkbox" ${g.depositConfirmed?'checked':''} onchange="UI.confirm('${g.id}','deposit',this.checked)">`:pill(g.depositConfirmed?'확인완료':'미확인',g.depositConfirmed?'ok':'warn')}</td><td>${Number(g.balance||0).toLocaleString()}만</td><td>${admin?`<input type="checkbox" ${g.balanceConfirmed?'checked':''} onchange="UI.confirm('${g.id}','balance',this.checked)">`:pill(g.balanceConfirmed?'완납':'미확인',g.balanceConfirmed?'ok':'warn')}</td><td>${pill(g.status==='cancelled'?'취소':'예약',g.status==='cancelled'?'bad':'ok')}</td><td>${admin||g.owner===actor?`<button class="btn small secondary" onclick="UI.cancelGuest('${g.id}')">${g.status==='cancelled'?'취소됨':'예약 취소'}</button>`:'조회만'}</td></tr>`).join('')||'<tr><td colspan="9" class="empty">등록된 손님이 없습니다.</td></tr>'}</tbody></table></div></div><div class="card"><h3 class="sectiontitle">손님 신규 예약 등록</h3><div class="field" style="max-width:380px"><label for="guestReservationDate">예약 날짜 선택 (필수)</label><select id="guestReservationDate" onchange="UI.date(this.value)">${dates(r,55).map(d=>`<option value="${d}" ${d===date?'selected':''}>${d} · ${r.short} ${r.time}</option>`).join('')}</select><p class="muted">날짜를 변경하면 해당 날짜의 손님 목록과 남은 자리가 함께 바뀝니다.</p></div>${n>=r.cap?`<div class="notice">이 날짜는 정원이 가득 찼습니다. 취소 처리 전까지 추가 등록할 수 없습니다.</div>`:''}<div class="grid two">${field('손님 닉네임','gn')}${field('손님 레벨','gl','number')}${field('손님 직업','gj')}${field('예약금 (만 메소)','gd','number','0')}${field('잔금 (만 메소)','gb','number','0')}</div><button class="btn" ${n>=r.cap?'disabled':''} onclick="UI.addGuest()">손님 예약 등록</button><p class="muted">예약 등록 즉시 정원 1자리를 차지합니다. 입금 확인은 관리자 전용입니다.</p></div>`}
function verification(){let users=admin?db.users.filter(u=>u.status==='approved'):me()?[me()]:[];return `<div class="card"><h3 class="sectiontitle">레벨·스공 스크린샷 인증</h3><p class="muted">공대원 본인이 사진을 올리고 공대장이 승인합니다. 사진은 데모 브라우저에만 저장됩니다.</p>${users.map(u=>`<div style="padding:15px 0;border-bottom:1px solid #eee"><div class="flex between"><b>${esc(u.nick)} · Lv.${esc(u.level)} · 스공 ${esc(u.power)}</b>${pill(u.verified?'인증완료':u.image?'승인대기':'미인증',u.verified?'ok':'warn')}</div><div class="photo" style="margin-top:10px">${u.image?`<img class="preview" src="${u.image}" alt="인증 스크린샷">`:'<span class="muted">등록된 스크린샷 없음</span>'}${!admin&&u.id===actor?`<input type="file" accept="image/png,image/jpeg,image/webp" onchange="UI.upload(event,'user','${u.id}')">`:''}${admin&&u.image?`<button class="btn small" onclick="UI.verify('${u.id}',true)">승인</button><button class="btn small secondary" onclick="UI.verify('${u.id}',false)">반려</button>`:''}</div>${!admin&&u.id===actor?`<div class="grid two" style="margin-top:10px">${field('레벨','level','number',u.level)}${field('스공','power','text',u.power)}</div><button class="btn small" onclick="UI.saveStats()">레벨·스공 수정</button>`:''}</div>`).join('')}</div>`}
function loot(){let items=db.loot.filter(x=>admin||me()?.raids.includes(x.raid));return `<div class="card"><h3 class="sectiontitle">트라이별 아이템 획득 스크린샷</h3><div class="tablewrap"><table><thead><tr><th>날짜</th><th>공대</th><th>회차</th><th>공대장 메모</th><th>스크린샷</th></tr></thead><tbody>${items.map(x=>`<tr><td>${x.date}</td><td>${rid(x.raid).short}</td><td>${x.tryNo}트라이</td><td>${esc(x.memo)}</td><td>${x.image?`<a href="${x.image}" target="_blank" rel="noopener"><img class="preview" src="${x.image}" alt="아이템 획득 화면"></a>`:'없음'}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">등록된 아이템 획득 기록이 없습니다.</td></tr>'}</tbody></table></div></div>${admin?`<div class="card"><h3 class="sectiontitle">아이템 획득 기록 등록 (공대장 전용)</h3><div class="grid two">${select('공대','lootRaid',raids.map(r=>[r.id,r.name]),raid)}${field('트라이 날짜','lootDate','date',date)}${select('트라이 회차','tryNo',[1,2,3,4,5].map(n=>[String(n),n+'트라이']),'1')}${field('획득 아이템 메모','lootMemo')}</div><div class="field"><label>스크린샷 (1장씩 등록, 같은 회차 여러 건 가능)</label><input id="lootFile" type="file" accept="image/png,image/jpeg,image/webp"></div><button class="btn" onclick="UI.addLoot()">기록 등록</button></div>`:''}`}
function phones(){if(!admin)return '<div class="card">관리자 전용 화면입니다.</div>';return `<div class="card"><h3 class="sectiontitle">📱 회원 휴대폰 관리 · 관리자 전용</h3><p class="muted">닉네임(로그인 아이디)별 휴대폰 번호를 한눈에 확인합니다. 이 검토판에는 실제 번호를 입력하지 마세요.</p><div class="tablewrap"><table><thead><tr><th>아이디(닉네임)</th><th>휴대폰 번호</th><th>가입 상태</th><th>소속 공대</th><th>관리</th></tr></thead><tbody>${db.users.map(u=>`<tr><td><b>${esc(u.nick)}</b></td><td>${esc(u.contact||'미등록')}</td><td>${esc(u.status)}</td><td>${u.raids.map(r=>rid(r).short).join(', ')||'-'}</td><td><button class="btn small secondary" onclick="UI.editPhone('${u.id}')">번호 수정</button></td></tr>`).join('')}</tbody></table></div><div id="phoneEditor"></div></div>`}
function signup(){return `<div class="card"><h3 class="sectiontitle">닉네임 아이디 · 휴대폰 번호 가입 신청</h3><p class="muted">로그인 아이디는 게임 닉네임입니다. 요청하신 휴대폰 번호 입력란을 추가했습니다. <b>휴대폰 번호를 비밀번호로 그대로 사용하는 방식은 유출 위험이 커서 실제 로그인에는 적용하지 않습니다.</b> 운영 버전은 별도 비밀번호 또는 휴대폰 인증이 필요합니다. 이 미리보기에는 실제 전화번호를 입력하지 마세요.</p>${field('게임 닉네임 (로그인 아이디)','signupNick')}${field('휴대폰 번호 (관리자만 열람)','signupPhone','tel','','placeholder="010-0000-0000" inputmode="tel" autocomplete="off"')}<button class="btn" onclick="UI.signup()">가입 신청 예시 등록</button></div>`}
function history(){return `<div class="card"><h3 class="sectiontitle">최근 변경 기록</h3>${db.logs.map(l=>`<div class="flex between" style="padding:10px;border-bottom:1px solid #eee"><span>${esc(l.what)} <span class="muted">· ${esc(l.by)}</span></span><span class="muted">${esc(l.at)}</span></div>`).join('')||'<div class="empty">변경 기록이 없습니다.</div>'}</div>`}
function authScreen(){let title=admin?'공대장 관리자 로그인':'공대원 로그인';return `<div class="auth-bg"><div class="auth-card"><div class="auth-logo">🛡️</div><h1>미래공대</h1><p class="muted">${title} · 기능 검토용</p><div class="auth-tabs"><button class="${authTab==='login'?'sel':''}" onclick="UI.authTab('login')">로그인</button>${admin?'':`<button class="${authTab==='signup'?'sel':''}" onclick="UI.authTab('signup')">회원가입</button>`}</div>${authTab==='signup'&&!admin?`<div class="field"><label>아이디 (게임 닉네임)</label><input id="authNick" placeholder="캐릭터 닉네임"></div><div class="field"><label>휴대폰 번호 (관리자만 열람)</label><input id="authPhone" type="tel" placeholder="실제 번호 입력 금지"></div><div class="field"><label>데모 비밀번호</label><input id="authPass" type="password" placeholder="테스트용 비밀번호"></div><div class="field"><label>비밀번호 확인</label><input id="authPass2" type="password" placeholder="다시 입력"></div><button class="btn auth-button" onclick="UI.authSignup()">가입 신청</button>`:`<div class="field"><label>아이디 (닉네임)</label><input id="authNick" placeholder="${admin?'공대장':'윤미래'}" autocomplete="off"></div><div class="field"><label>데모 비밀번호</label><input id="authPass" type="password" placeholder="테스트 비밀번호" onkeydown="if(event.key==='Enter')UI.login()"></div><button class="btn auth-button" onclick="UI.login()">로그인</button>`}<div class="notice" style="margin-top:18px">⚠ 로컬 시연용 로그인입니다. 서버 보안이 없으므로 <b>실제 비밀번호·전화번호를 입력하지 마세요.</b><p style="margin-bottom:0">테스트: ${admin?'공대장 / admin1234':'윤미래 / demo1234 또는 빛나연 / demo1234'}</p></div>${admin?'':`<p class="muted" style="text-align:center">가입 후 공대장 승인 전에는 내부 메뉴를 볼 수 없습니다.</p>`}<div class="auth-foot"><a href="index.html">공대원 사이트</a> · <a href="admin.html">관리자 사이트</a></div></div></div>`}
